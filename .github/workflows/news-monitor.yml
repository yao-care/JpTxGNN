name: 健康ニュース監視

on:
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごとに実行
  workflow_dispatch:        # 手動トリガー

permissions:
  contents: write
  actions: write  # 推送後觸發 pages.yml（GITHUB_TOKEN 的 push 不會觸發其他 workflow）

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 lxml

      # Step 1: キーワードリストの確認
      - name: Check keywords.json
        run: |
          if [ ! -f data/news/keywords.json ]; then
            echo "キーワードリストを生成中..."
            python scripts/generate_news_keywords.py
          fi

      # Step 2: 日本のニュースソースからフェッチ
      - name: Fetch from Japan news sources
        run: |
          if [ -f scripts/fetchers/japan_news.py ]; then
            python scripts/fetchers/japan_news.py
          fi

      # Step 3: 処理とページ生成
      - name: Process and generate pages
        run: python scripts/process_news.py

      # Step 4: 変更をコミット
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # 変更があるファイルのみ追加（存在しないパスを無視）
          [ -d data/news ] && git add data/news/*.json 2>/dev/null || true
          [ -d docs/_news ] && git add docs/_news/
          [ -f docs/data/news-index.json ] && git add docs/data/news-index.json
          [ -f docs/_data/drug_news.json ] && git add docs/_data/drug_news.json || true

          # 変更の確認
          if git diff --staged --quiet; then
            echo "ニュースの更新なし"
          else
            git commit -m "健康ニュース更新 $(date +%Y-%m-%d-%H%M)"
            git push
            gh workflow run pages.yml --ref main || echo "Pages dispatch failed"
          fi
