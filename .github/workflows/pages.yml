name: Deploy Jekyll site to Pages
# 部署步驟偶爾遇到 GitHub 暫時錯誤（Deployment failed, try again later）：在 Actions 頁按 Re-run，或推一個改到 docs/ 或本檔的 commit 重新部署。

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/stamp_sitemap_lastmod.py'
      - 'scripts/stamp_fhir_counts.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 🔴 sitemap 的 lastmod 取 git commit 日期，淺 clone 只有一個 commit
          #    會讓全站日期一模一樣（＝假訊號，比沒有 lastmod 更糟）。
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Check docs SEO gate (permalinks, llms.txt, JSON-LD, brand block/search-index = brand_names.json)
        run: python3 scripts/check_seo_docs.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site

      # jekyll-sitemap 只給有 date／last_modified_at 的頁 lastmod，首頁、about 等固定頁都沒有。
      # 沒有 lastmod，Google 沒有「這頁變了」的訊號，seo-ops 的 sitemap 過期重送判準也只
      # 剩「網址數有沒有變」，改寫既有頁面永遠不會觸發。官方 jekyll-build-pages 受 GitHub
      # Pages 插件白名單限制裝不了 jekyll-last-modified-at，故在建置後直接蓋。
      # 這一步失敗不擋部署（腳本自己吞掉錯誤並印出哪幾個網址沒蓋到）。
      - name: Stamp sitemap lastmod from git history
        run: |
          # actions/jekyll-build-pages 在容器裡以 root 產出 _site，後續步驟是 runner
          # 身分，直接寫會 PermissionError: [Errno 13]（2026-08-21 run 32443001028 實遇：
          # 讀得到、寫不進去，腳本照設計警告後放行，站照常部署但 lastmod 沒蓋上）。
          sudo chown -R "$(id -u):$(id -g)" ./_site
          python3 scripts/stamp_sitemap_lastmod.py ./_site/sitemap.xml

      # 在 FHIR metadata 寫入這次建置實際輸出的資源數（yao.care 官網讀這個 extension 加總 30 站），
      # 並在沒有 Bundle/all-predictions.json 的站用同一批資源產生（downloads 頁有列這個網址）。
      # 失敗不擋部署。
      - name: Stamp FHIR resource counts
        run: python3 scripts/stamp_fhir_counts.py ./_site/fhir --bundle

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
